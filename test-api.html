<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V.E.R.A Open Knowledge Check</title>
</head>
<body>
    <main>
        <h1>V.E.R.A open knowledge check</h1>
        <p>This test fetches a topic summary from Wikipedia’s free MediaWiki API. No API key is required.</p>
        <button type="button" id="testButton">Test Wikipedia lookup</button>
        <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
        document.getElementById('testButton').addEventListener('click', async () => {
            const result = document.getElementById('result');
            result.textContent = 'Searching Wikipedia...';

            try {
                const params = new URLSearchParams({
                    action: 'query',
                    generator: 'search',
                    gsrsearch: 'artificial intelligence',
                    gsrnamespace: '0',
                    gsrlimit: '1',
                    prop: 'extracts',
                    exintro: '1',
                    explaintext: '1',
                    exchars: '600',
                    format: 'json',
                    origin: '*'
                });
                const response = await fetch(`https://en.wikipedia.org/w/api.php?${params}`);
                if (!response.ok) throw new Error(`Wikipedia returned ${response.status}.`);

                const data = await response.json();
                const page = Object.values(data.query?.pages || {})[0];
                if (!page || !page.extract) throw new Error('No matching article was found.');

                const summary = document.createElement('p');
                summary.textContent = `${page.title}: ${page.extract}`;
                const source = document.createElement('a');
                source.href = `https://en.wikipedia.org/wiki/${encodeURIComponent(page.title.replace(/ /g, '_'))}`;
                source.target = '_blank';
                source.rel = 'noopener noreferrer';
                source.textContent = 'Source: Wikipedia (CC BY-SA)';
                result.replaceChildren(summary, source);
            } catch (error) {
                result.textContent = `Lookup failed: ${error.message}`;
            }
        });
    </script>
</body>
</html>
