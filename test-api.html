<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>OpenAI API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        const OPENAI_API_KEY = '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';
        const OPENAI_API_URL = 'https://openrouter.ai/api/v1/chat/completions';

        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';

            try {
                const response = await fetch(OPENAI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`,
                        'HTTP-Referer': 'https://vera-ai.com',
                        'X-Title': 'V.E.R.A AI Assistant'
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-3.5-turbo',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are V.E.R.A, a helpful AI assistant.'
                            },
                            {
                                role: 'user',
                                content: 'What is artificial intelligence?'
                            }
                        ],
                        max_tokens: 100,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const data = await response.json();
                resultDiv.innerHTML = `<h3>Success!</h3><p>${data.choices[0].message.content.trim()}</p>`;
                console.log('API Response:', data);
            } catch (error) {
                resultDiv.innerHTML = `<h3>Error:</h3><p>${error.message}</p>`;
                console.error('API Error:', error);
            }
        }
    </script>
</body>
</html>
